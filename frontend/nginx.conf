server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Development: disable aggressive caching so updates reflect immediately
    add_header Access-Control-Allow-Origin *;
    add_header X-Content-Type-Options "nosniff";

    # Static CSS files with verified MIME type
    location ~* \.css$ {
        default_type text/css;
        add_header Content-Type "text/css; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files $uri =404;
    }

    # Static JavaScript files with verified MIME type
    location ~* \.js$ {
        default_type application/javascript;
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files $uri =404;
    }

    # Images, SVGs and fonts
    location ~* \.(svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Single Page Application fallback
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
